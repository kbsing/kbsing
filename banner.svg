<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#30363d"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <mask id="dotsMask">
      <rect width="1200" height="280" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- background -->
  <rect width="1200" height="280" rx="16" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1197" height="277" rx="15" fill="none" stroke="#30363d" stroke-width="3"/>

  <!-- e-ink dither dots, fading in to the right -->
  <rect width="1200" height="280" rx="16" fill="url(#dots)" mask="url(#dotsMask)"/>

  <!-- name -->
  <text x="64" y="112" font-family="Consolas, 'SF Mono', monospace" font-size="42" font-weight="700" fill="#3fb950">&gt;_</text>
  <text x="150" y="118" font-size="58" font-weight="700" fill="#e6edf3">Yuki</text>
  <text x="153" y="154" font-size="22" fill="#8b949e">@kbsing &#183; tinkerer of stubborn hardware</text>

  <!-- chips -->
  <g font-size="16" fill="#c9d1d9">
    <rect x="64" y="196" width="150" height="36" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="139" y="219" text-anchor="middle">FIRMWARE&#160;RE</text>
    <rect x="228" y="196" width="100" height="36" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="278" y="219" text-anchor="middle">E-INK</text>
    <rect x="342" y="196" width="100" height="36" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="392" y="219" text-anchor="middle">ESP32</text>
    <rect x="456" y="196" width="116" height="36" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="514" y="219" text-anchor="middle">ANDROID</text>
  </g>

  <!-- e-ink panel illustration -->
  <g transform="translate(924, 52)">
    <rect width="212" height="176" rx="10" fill="#ededeb" stroke="#30363d" stroke-width="4"/>
    <path d="M32,88 C62,42 88,134 118,88 S168,42 180,88" stroke="#1f2328" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="24" y="120" width="86" height="10" rx="5" fill="#1f2328" opacity="0.15"/>
    <rect x="24" y="138" width="126" height="10" rx="5" fill="#1f2328" opacity="0.15"/>
    <text x="106" y="166" text-anchor="middle" font-family="Consolas, 'SF Mono', monospace" font-size="15" fill="#1f2328">e-ink</text>
  </g>
</svg>
